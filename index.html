<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Interactive Phone Sim</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="phone">
    <div id="screen">
      <!-- Lock Screen -->
      <div id="lockScreen" class="screen-layer active">
        <div class="status-bar">
          <span class="carrier">中国联通</span>
          <div class="status-right">
            <span class="signal">▮▮▮</span>
            <span class="network">4G</span>
            <span class="battery">🔋</span>
          </div>
        </div>
        <div class="lock-date" id="lockDate">10月20日周二 · 丙午年九月十一</div>
        <div class="lock-time" id="lockTime">2:14</div>
        <div class="lock-widgets">
          <div class="widget-row">
            <div class="widget circle">📱</div>
            <div class="widget circle">❤️ 11</div>
            <div class="widget circle">🎵</div>
            <div class="widget circle">⏰</div>
          </div>
        </div>
        <div class="lock-bottom">
          <div class="lock-btn">🔦</div>
          <div class="lock-name">🐾 Fionna</div>
          <div class="lock-btn">📷</div>
        </div>
        <div class="swipe-hint">向上滑动解锁</div>
      </div>

      <!-- Home Screen -->
      <div id="homeScreen" class="screen-layer">
        <div class="status-bar dark">
          <span id="homeTime">22:15</span>
          <span class="paw">🐾</span>
          <div class="status-right">
            <span class="signal">▮▮▮</span>
            <span class="network">4G</span>
            <span class="battery">🔋</span>
          </div>
        </div>

        <!-- Notification Preview -->
        <div id="notifPreview" class="notif-preview hidden">
          <div class="notif-header">所有收件箱 <span>136</span></div>
          <div class="notif-item"><strong>Claude Team</strong> <span>17:45</span><br>Set your preferences once...</div>
          <div class="notif-item"><strong>Google</strong> <span>15:04</span><br>你与“Canva”共享了一些 Google 账号数据</div>
        </div>

        <div class="home-content">
          <div class="app-grid" id="appGrid">
            <!-- Folders & Apps will be injected -->
          </div>
          <div class="search-bar">🔍 搜索</div>
        </div>

        <div class="dock">
          <div class="dock-app" data-app="phone">📞</div>
          <div class="dock-app" data-app="safari">🧭</div>
          <div class="dock-app" data-app="messages">
            💬
            <span class="badge" id="msgBadge">181</span>
          </div>
          <div class="dock-app" data-app="maps">🗺️</div>
        </div>
      </div>

      <!-- App Screens -->
      <div id="appScreen" class="screen-layer">
        <div class="app-header">
          <button id="backBtn">‹ 返回</button>
          <span id="appTitle">App</span>
          <button id="configBtn">⚙️</button>
        </div>
        <div id="appContent"></div>
      </div>

      <!-- Config / Settings Overlay -->
      <div id="configOverlay" class="overlay hidden">
        <div class="config-panel">
          <h2>互动配置中心</h2>
          <p class="hint">可自定义角色、对话、事件。数据保存在本地，支持导出/导入。</p>
          
          <section>
            <h3>手机主人</h3>
            <label>名字 <input id="cfgOwnerName" type="text" value="Fionna" /></label>
            <label>壁纸风格
              <select id="cfgWallpaper">
                <option value="purple">紫色抽象</option>
                <option value="fabric">白色褶皱布料</option>
              </select>
            </label>
          </section>

          <section>
            <h3>联系人（WhatsApp）</h3>
            <div id="contactList"></div>
            <button id="addContactBtn">+ 添加联系人</button>
          </section>

          <section>
            <h3>动态事件系统</h3>
            <label><input type="checkbox" id="cfgEvents" checked /> 启用随机动态事件</label>
            <label>事件频率
              <select id="cfgEventFreq">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
              </select>
            </label>
          </section>

          <section>
            <h3>数据管理</h3>
            <button id="exportBtn">导出配置 (JSON)</button>
            <button id="importBtn">导入配置</button>
            <input type="file" id="importFile" accept=".json" hidden />
            <button id="resetBtn" class="danger">重置为默认</button>
          </section>

          <button id="closeConfig" class="primary">完成并应用</button>
        </div>
      </div>

      <!-- Incoming Call Overlay -->
      <div id="callOverlay" class="overlay hidden">
        <div class="call-ui">
          <div class="call-avatar">👤</div>
          <div class="call-name" id="callName">未知</div>
          <div class="call-status">来电中...</div>
          <div class="call-actions">
            <button id="declineCall" class="decline">拒绝</button>
            <button id="acceptCall" class="accept">接听</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
